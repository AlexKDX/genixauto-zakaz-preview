<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1b2b">
<title>Квиз zakaz.genixauto.ru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Квиз zakaz.genixauto.ru: шапка как на основном сайте, первый экран со светлым фоном, квиз в тёмной теме. Внизу переключатель 5 дизайнов колеса фортуны. */
:root{
  --navy:#0e1b2b; --navy-2:#162a42; --navy-3:#22374f; --red:#c4312a; --red-h:#e92a20;
  --green:#1f9d55; --green-l:#5fd193; --ground:#09131f; --card:#ffffff;
  --ink:#0e1b2b; --ink-2:#4a5a6e; --muted:#a9bbd1; --line:#d3dbe5; --blue:#2b5ea8; --gold:#f5c542;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ground);overflow-x:clip}
.stage-wrap,.hero-vis{overflow-x:clip}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding-bottom:40px;transition:background .3s}
body.dark{background:var(--navy);color:#fff}
html:has(body.dark){background:var(--navy)}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== шапка как на сайте ===== */
.hdr-top{background:var(--navy);color:#fff;font-size:14px}
.hdr-top ul{list-style:none;margin:0 auto;max-width:1180px;padding:7px 16px;display:flex;justify-content:space-between;gap:12px}
.hdr-top a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.hdr-top a:hover{color:#cdffff}
.hdr-top svg{width:15px;height:15px}
.hdr{background:#0e1b2b;border-bottom:1px solid var(--navy-3);box-shadow:0 10px 30px -18px rgba(0,0,0,.7)}
.hdr-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:flex-start;gap:12px}
.hdr img{height:64px;width:auto}
.hdr .site{background:var(--red);color:#fff;text-decoration:none;font-weight:800;font-size:17px;border-radius:10px;padding:10px 16px}
.hdr .site:hover{background:var(--red-h)}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.screen{padding-block:24px}
h1,h2{margin:0;text-wrap:balance;letter-spacing:-.025em}
h1{font-size:clamp(26px,3.5vw,40px);line-height:1.12;font-weight:800}
h2{font-size:clamp(22px,3vw,32px);line-height:1.18;font-weight:800}
.sub{color:var(--muted);margin:10px 0 0;max-width:58ch}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;font-size:18px;padding:16px 28px;text-decoration:none;transition:background .15s,transform .12s;box-shadow:0 10px 24px -10px rgba(196,49,42,.7)}
.btn:hover{background:var(--red-h);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn .shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.btn.ghost{background:transparent;color:var(--muted);padding:10px 4px;font-weight:700;font-size:15px;box-shadow:none}
.btn.ghost:hover{color:#fff;transform:none}

/* ===== первый экран (сплит, колесо поверх фото) ===== */
.hero{border:1px solid var(--navy-3);position:relative;background:var(--navy);color:#fff;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:.9fr 1.1fr;min-height:540px}
.hero-txt{position:relative;z-index:2;padding:40px 36px;display:flex;flex-direction:column;justify-content:center}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:rgba(245,197,66,.14);color:var(--gold);border:1px solid rgba(245,197,66,.4);border-radius:99px;padding:7px 14px;font-weight:800;font-size:13px;letter-spacing:.03em;margin-bottom:16px;text-transform:uppercase}
.hero .sub{color:#c9d4e3}
.prizes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:22px 0 24px;max-width:460px}
.pz{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.pz span{font-size:22px;line-height:1}
.pz small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.proof{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:13px;color:#c9d4e3}
.proof b{color:#fff}.proof i{font-style:normal;color:var(--green-l)}
.hero-vis{position:relative;min-height:360px}
.hero-vis .photo{position:absolute;inset:0;background-size:cover;background-position:30% 40%}
.hero-vis .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--navy) 0%,rgba(14,27,43,.3) 40%,rgba(14,27,43,.15) 100%)}
.hero-wheel{position:absolute;z-index:3;right:3%;top:50%;transform:translateY(-50%);width:min(420px,80%);cursor:pointer}
.tease{position:absolute;z-index:4;right:18px;top:18px;background:var(--red);color:#fff;font-weight:800;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.2;box-shadow:0 10px 20px -8px rgba(0,0,0,.5);animation:bob 2.4s ease-in-out infinite}
.tease small{display:block;font-weight:600;font-size:11px;opacity:.85}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ===== квиз (тёмная тема) ===== */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.prog-bar{flex:1;min-width:160px;height:10px;background:var(--navy-3);border-radius:99px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-l));border-radius:99px;transition:width .4s;box-shadow:0 0 14px rgba(95,209,147,.6)}
.prog-txt{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.fmini{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--gold);background:rgba(245,197,66,.14);border-radius:99px;padding:5px 10px;white-space:nowrap}
.fmini svg{width:16px;height:16px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qhead{margin-bottom:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.opt{position:relative;overflow:hidden;display:flex;flex-direction:column;text-align:left;background:var(--navy-2);color:#fff;border:3px solid var(--navy-3);border-radius:16px;padding:0;transition:border-color .18s,transform .18s,box-shadow .18s;min-width:0}
.opt:hover{transform:translateY(-4px);border-color:var(--green-l);box-shadow:0 0 0 4px rgba(95,209,147,.15),0 18px 30px -16px rgba(0,0,0,.8)}
.opt:active{transform:scale(.97)}
.opt.sel{border-color:var(--green-l);box-shadow:0 0 24px rgba(95,209,147,.35);animation:selpop .35s}
@keyframes selpop{40%{transform:scale(1.04)}}
.opt .ph{position:relative;aspect-ratio:16/10;overflow:hidden;background:#0a1420}
.opt .ph img{width:100%;height:100%;object-fit:cover;transition:transform .45s}
.opt:hover .ph img{transform:scale(1.08)}
.opt .icb{display:grid;place-items:center;height:120px;background:linear-gradient(160deg,#1c3350,#13253b);color:#fff;transition:background .2s,color .2s}
.opt .icb svg{width:58px;height:58px;transition:transform .3s}
.opt:hover .icb svg{transform:scale(1.15) rotate(-4deg)}
.opt.sel .icb{background:linear-gradient(160deg,#164d33,#123826);color:var(--green-l)}
.opt .flag{display:grid;place-items:center;height:150px;background:radial-gradient(circle at 50% 45%,#1f3b5c,#13253b 70%)}
.opt .flag svg{width:96px;height:96px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));transition:transform .35s}
.opt:hover .flag svg{transform:scale(1.1) rotate(-6deg)}
.opt .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .lbl{font-weight:800;font-size:17px}
.opt .hint{font-size:13px;color:var(--muted)}
.opt .chk{position:absolute;z-index:2;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:800;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.opt.sel .chk{transform:scale(1)}
.opt .go{position:absolute;right:14px;bottom:16px;color:var(--green-l);font-weight:800;opacity:0;transform:translateX(-6px);transition:.2s}
.opt:hover .go{opacity:1;transform:none}
.rip{position:absolute;border-radius:50%;background:rgba(95,209,147,.25);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin-top:12px}

/* ===== экран колеса ===== */
.wheel-box{display:grid;grid-template-columns:1fr minmax(0,1.1fr);gap:32px;align-items:center}
.stage-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.stage{width:min(520px,100%)}
.legend{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.legend li{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;background:var(--navy-2);border:1px solid var(--navy-3);border-radius:10px;padding:10px 12px}
.legend li span{font-size:20px}
.prize{margin-top:16px;padding:16px;border-radius:14px;background:#123826;border:2px solid var(--green-l);display:none}
.prize.show{display:block;animation:pop .45s}
.prize b{display:block;font-size:24px;color:var(--green-l)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* общие детали колёс */
.dz{position:relative;width:100%;user-select:none}
.dz svg{display:block;width:100%;height:auto;overflow:visible}
.pointer{position:absolute;z-index:3;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:32px solid var(--red);filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.rotor{transform-origin:200px 200px}
.mini .rotor{animation:spin 16s linear infinite}
.hero-wheel:hover .mini .rotor{animation-duration:4s}

/* 1. колесо авто */
.tire .pointer{top:-4px}
.tire .ground{position:absolute;left:0;right:0;bottom:-2%;height:9%;background:linear-gradient(180deg,#2a2f36,#15191e);border-radius:6px;z-index:0}
.tire .skid{position:absolute;left:50%;top:30%;height:30%;width:0;transform:translateX(-50%);background:repeating-linear-gradient(90deg,#000 0 6px,#0b0b0b 6px 10px);opacity:.8;border-radius:3px}
.tire svg{position:relative;z-index:1}
.tire canvas{position:absolute;left:-30%;top:-30%;width:160%;height:140%;z-index:2;pointer-events:none}
.mini.tire .ground{display:none}

/* 2. тахометр */
.gauge .rpm{font-variant-numeric:tabular-nums}
.gauge .redflash{animation:none}
.gauge.red .redflash{animation:flash .15s steps(2) infinite}
@keyframes flash{50%{opacity:.2}}
.mini.gauge .needle{transform-origin:200px 215px;animation:idleNeedle 3s ease-in-out infinite}
@keyframes idleNeedle{0%,100%{transform:rotate(-100deg)}50%{transform:rotate(60deg)}}

/* 3. рулетка: без особых правил */

/* 4. слот-барабан */
.slot{display:flex;align-items:center;gap:14px}
.slot .box{flex:1;background:linear-gradient(180deg,#2b1a0e,#4b2a12);border-radius:22px;padding:16px;border:4px solid #d4a017;box-shadow:inset 0 0 0 3px #6b3d14,0 18px 34px -12px rgba(0,0,0,.7);position:relative}
.slot .bulbs{display:flex;justify-content:space-between;margin:-4px 4px 10px}
.slot .bulbs i{width:10px;height:10px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px #ffd23a;animation:blink 1s infinite}
.slot .bulbs i:nth-child(2n){animation-delay:.5s}
@keyframes blink{50%{background:#7a5a10;box-shadow:none}}
.slot .win{position:relative;height:216px;overflow:hidden;border-radius:12px;background:#0b1522;border:3px solid #111}
.slot .win::before,.slot .win::after{content:"";position:absolute;left:0;right:0;height:72px;z-index:2;pointer-events:none}
.slot .win::before{top:0;background:linear-gradient(#0b1522,rgba(11,21,34,.2))}
.slot .win::after{bottom:0;background:linear-gradient(rgba(11,21,34,.2),#0b1522)}
.slot .line{position:absolute;left:-6px;right:-6px;top:72px;height:72px;border:3px solid var(--red);border-radius:10px;z-index:3;pointer-events:none;box-shadow:0 0 14px rgba(196,49,42,.6)}
.slot .strip{will-change:transform}
.slot .cell{height:72px;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:19px;color:#fff;border-bottom:1px solid #1b2a3c}
.slot .cell span{font-size:30px}
.mini.slot .strip{animation:scroll 6s linear infinite}
@keyframes scroll{to{transform:translateY(-576px)}}
.slot .lever{width:26px;height:200px;position:relative;flex-shrink:0}
.slot .lever .rod{position:absolute;left:10px;top:40px;width:6px;height:120px;background:linear-gradient(90deg,#9aa,#eee,#9aa);border-radius:3px;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.5,1.8,.5,1)}
.slot .lever .knob{position:absolute;left:0;top:-14px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7b72,var(--red) 60%,#7a1712)}
.slot .lever.pull .rod{transform:scaleY(-.6)}
.slot .lever .base{position:absolute;left:3px;bottom:20px;width:20px;height:30px;border-radius:6px;background:#333}

/* 5. шоу-колесо с лампочками */
.show .pointer{display:none}
.show .flap{transform-origin:200px 18px;transition:transform .05s}
.mini.show .bulb{animation:bulb 1.2s infinite}
@keyframes bulb{50%{fill:#5a4a1a}}

/* ===== форма ===== */
.form-card{background:var(--navy-2);color:#fff;border:1px solid var(--navy-3);border-radius:20px;padding:28px;max-width:600px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.field input{font:inherit;font-size:16px;padding:15px;border:2px solid var(--navy-3);border-radius:12px;background:var(--navy);color:#fff}
.field input:focus{border-color:var(--green-l);outline:none}
.field.err input{border-color:var(--red)}
.err-msg{color:#ff7b72;font-size:13px;font-weight:700;display:none}
.field.err .err-msg{display:block}
.contacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ct{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border:2px solid var(--navy-3);border-radius:12px;background:var(--navy);color:#fff;font-size:13px;font-weight:800;transition:.18s}
.ct:hover{border-color:var(--green-l);transform:translateY(-2px)}
.ct .cic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.ct .cic svg{width:26px;height:26px}
.ct.sel{border-color:var(--green-l);background:#123826}
.ct.sel::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--green-l);font-weight:800}
.bonus-tag{display:flex;align-items:center;gap:10px;background:rgba(245,197,66,.1);border:2px dashed var(--gold);color:#fff;font-weight:800;border-radius:14px;padding:12px 14px;font-size:15px;margin-top:14px}
.bonus-tag span{font-size:24px}
.agree{display:flex!important;align-items:center;gap:10px;font-size:15px!important;font-weight:600!important;color:#fff!important;cursor:pointer}
.agree input{width:20px;height:20px;accent-color:var(--green);flex-shrink:0;cursor:pointer}
.agree a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.agree a:hover{color:var(--green-l)}
.legal{font-size:12px;color:var(--muted);margin-top:12px}
.legal a{color:#7fb0f0}

/* ===== спасибо ===== */
.thanks{text-align:center;background:var(--navy-2);border:1px solid var(--navy-3);color:#fff;border-radius:20px;padding:44px 24px}
.thanks .logow{height:60px;width:auto;margin:0 auto 22px}
.thanks .sub{color:#c9d4e3;margin-inline:auto}
.big-check{width:90px;height:90px;margin:0 auto 18px;border-radius:50%;border:4px solid var(--green-l);display:grid;place-items:center;color:var(--green-l);animation:pop .5s}
.big-check svg{width:46px;height:46px}
.thanks .bonus-tag{max-width:440px;margin:18px auto 0;justify-content:center}
.thanks .btn{margin-top:24px}
.socials{display:flex;justify-content:center;gap:12px;margin-top:22px}
.socials a{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;transition:transform .15s}
.socials a:hover{transform:translateY(-3px)}
.socials svg{width:24px;height:24px}
.tg-preview{margin:24px auto 0;max-width:420px;text-align:left}
.tg-preview summary{cursor:pointer;font-size:13px;color:var(--muted)}
.tg-preview pre{white-space:pre-wrap;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px;font-size:13px;margin:10px 0 0;font-family:ui-monospace,Menlo,monospace}


@media (max-width:860px){
  .hero{grid-template-columns:1fr;min-height:0}
  .hero-txt{padding:26px 20px}
  .hero-vis{min-height:340px;order:-1}
  .hero-vis .photo::after{background:linear-gradient(0deg,var(--navy) 0%,rgba(14,27,43,.2) 60%)}
  .hero-wheel{right:auto;left:50%;transform:translate(-50%,-50%);width:min(300px,80%)}
  .wheel-box{grid-template-columns:1fr}
  .stage-wrap{order:-1}
  }
@media (min-width:600px) and (max-width:1024px){
  .opts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero-txt{padding:32px 28px}
  .wheel-box{gap:24px}
  .form-card{margin-inline:auto}
}
@media (max-width:520px){
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .opt .lbl{font-size:15px}.opt .tx{padding:10px 12px 12px}
  .opt .icb{height:96px}.opt .flag{height:120px}.opt .flag svg{width:76px;height:76px}
  .contacts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-card{padding:20px}.legend{grid-template-columns:1fr}
  .hdr img{height:36px}
  .pz{gap:8px;padding:10px;font-size:13px}.pz span{font-size:20px}.pz small{font-size:10.5px}
        }
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="hdr"><div class="hdr-in"><img id="logoTop" alt="GENIXAUTO" style="cursor:pointer" title="На главную"></div></header>
<main class="wrap" id="app"></main>

const SEG=[
  {p:'Скидка 5 000 ₽',s:'5 000 ₽',c:'#c4312a',t:'#fff'},{p:'Полный бак',s:'Бак',c:'#f2f4f7',t:'#0e1b2b'},

  {p:'Полный бак',s:'Бак',c:'#f2f4f7',t:'#0e1b2b'},{p:'Скидка 5 000 ₽',s:'5 000 ₽',c:'#c4312a',t:'#fff'},
  {p:'Химчистка авто',s:'Химчистка',c:'#0e1b2b',t:'#fff'},{p:'Полный бак',s:'Бак',c:'#2b5ea8',t:'#fff'},
];
/* шанс выпадения: 5 000 ₽ и бак по 47%, 10 000 ₽ и химчистка по 3% (на колесе 3+3+1+1 сектора) */
const WEIGHT={'Скидка 5 000 ₽':47,'Полный бак':47,'Скидка 10 000 ₽':3,'Химчистка авто':3};
const PIC={'Скидка 5 000 ₽':'💸','Скидка 10 000 ₽':'💰','Полный бак':'⛽','Химчистка авто':'🧽'};
const N=SEG.length, SD=360/N;
function pickSeg(){const c=Object.keys(WEIGHT);let r=Math.random()*c.reduce((s,k)=>s+WEIGHT[k],0),cat=c[0];for(const k of c)if((r-=WEIGHT[k])<0){cat=k;break}const idx=SEG.map((s,i)=>s.p===cat?i:-1).filter(i=>i>=0);return idx[Math.random()*idx.length|0]}

/* геометрия: 0° — вверх, по часовой */
const P=(cx,cy,r,d)=>[cx+r*Math.sin(d*Math.PI/180),cy-r*Math.cos(d*Math.PI/180)];
function sector(cx,cy,r0,r1,a0,a1){const [x0,y0]=P(cx,cy,r1,a0),[x1,y1]=P(cx,cy,r1,a1),[x2,y2]=P(cx,cy,r0,a1),[x3,y3]=P(cx,cy,r0,a0),l=a1-a0>180?1:0;
  return `M${x0} ${y0}A${r1} ${r1} 0 ${l} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${l} 0 ${x3} ${y3}Z`}
function label(cx,cy,r,mid,s,fs=13,ic=true){return `<g transform="rotate(${mid} ${cx} ${cy})">${ic?`<text x="${cx}" y="${cy-r-14}" text-anchor="middle" font-size="${fs+8}">${PIC[s.p]}</text>`:''}<text x="${cx}" y="${cy-r+6}" text-anchor="middle" fill="${s.t}" font-family="Manrope,sans-serif" font-weight="800" font-size="${fs}">${s.s}</text></g>`}
function targetAngle(from,i,turns){const want=((360-(i+.5)*SD)%360+360)%360;const jit=(Math.random()-.5)*SD*.55;return from-(((from%360)+360)%360)+turns*360+want+jit}

/* разгон-торможение: короткий разгон, потом плавное замедление */
function profile(total,T,ramp){const T2=T-ramp,a1=(3*total/T2)/(2/ramp+3/T2),vmax=2*a1/ramp;
  return t=>{if(t<ramp)return{a:a1*(t/ramp)**2,v:2*a1*t/ramp**2/vmax};const u=Math.min(1,(t-ramp)/T2);return{a:a1+(total-a1)*(1-(1-u)**3),v:3*(total-a1)*(1-u)**2/T2/vmax}}}
function run(T,frame,done){const t0=performance.now();(function f(n){const t=Math.min(T,(n-t0)/1000);frame(t);t<T?requestAnimationFrame(f):done()})(t0)}
let uid=0;

{ name:'Колесо авто', desc:'Буксует с дымом и раскручивается',

    s+=`<defs><radialGradient id="${id}r" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#f3f5f8"/><stop offset=".6" stop-color="#b8c0ca"/><stop offset="1" stop-color="#6c7682"/></radialGradient><linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="#8b949e"/><stop offset=".5" stop-color="#f4f6f8"/><stop offset="1" stop-color="#8b949e"/></linearGradient><path id="${id}p" d="M200 200m-176 0a176 176 0 1 1 352 0a176 176 0 1 1-352 0"/></defs>`;

    s+=`<text font-family="Manrope,sans-serif" font-weight="800" font-size="11" fill="#5a5a5a" letter-spacing="3"><textPath href="#${id}p">GENIXAUTO • 255/45 R19 • GENIXAUTO • 255/45 R19 • GENIXAUTO • 255/45 R19 •</textPath></text>`;
    s+=`<circle cx="200" cy="200" r="160" fill="url(#${id}r)"/>`;
    SEG.forEach((g,i)=>{s+=`<path d="${sector(cx,cy,46,154,i*SD+2,(i+1)*SD-2)}" fill="${g.c}" opacity=".95"/>`+label(cx,cy,100,(i+.5)*SD,g,g.s.length>6?10.5:13)});
    for(let i=0;i<N;i++){s+=`<g transform="rotate(${i*SD} 200 200)"><path d="M197.5 160L197 48h6l-.5 112z" fill="url(#${id}s)" stroke="#555" stroke-width=".6"/></g>`}
    s+=`<circle cx="200" cy="200" r="44" fill="#2a2f36" stroke="url(#${id}s)" stroke-width="5"/>`;
    for(let i=0;i<5;i++){const [x,y]=P(200,200,28,i*72);s+=`<circle cx="${x}" cy="${y}" r="5" fill="#c9d0d8" stroke="#333"/>`}
    s+=`<text x="200" y="209" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="24" fill="#fff">G</text></g>`;
    host.innerHTML=`<div class="dz tire ${mini?'mini':''}"><div class="ground"><i class="skid"></i></div><canvas></canvas><div class="pointer"></div><svg viewBox="0 0 400 400">${s}</svg></div>`;
    const rotor=host.querySelector('.rotor'),svg=host.querySelector('svg'),cv=host.querySelector('canvas'),skid=host.querySelector('.skid');let ang=0;
    return {spin(i,done){
      const ctx=cv.getContext('2d');cv.width=cv.clientWidth;cv.height=cv.clientHeight;const W=cv.width,H=cv.height;
      const parts=[];const total=targetAngle(ang,i,9)-ang,from=ang,pf=profile(total,6.2,1.3);
      const cxp=W*.5,cyp=H*(.3/1.4+ (1/1.4)*.97);
      run(6.2,t=>{const{a,v}=pf(t);ang=from+a;
        const burn=t<2.2?1:Math.max(0,1-(t-2.2)/2);const shake=(t<1.6?3.2:2)*v*burn;
        rotor.style.transform=`rotate(${ang}deg)`;svg.style.transform=`translate(${(Math.random()-.5)*shake}px,${(Math.random()-.5)*shake}px)`;
        skid.style.width=Math.min(90,t*55)+'%';
        const em=Math.round(10*v*burn);for(let k=0;k<em;k++)parts.push({x:cxp+(Math.random()-.5)*W*.18,y:cyp,vx:(Math.random()-.3)*-4-1,vy:-Math.random()*2.4-.6,r:8+Math.random()*10,a:.55,g:Math.random()*.6+.2});
        ctx.clearRect(0,0,W,H);for(let k=parts.length-1;k>=0;k--){const q=parts[k];q.x+=q.vx;q.y+=q.vy;q.vx*=.985;q.r+=.9;q.a-=.006;if(q.a<=0){parts.splice(k,1);continue}
          const gr=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r);gr.addColorStop(0,`rgba(${210+q.g*40|0},${210+q.g*40|0},${215+q.g*40|0},${q.a})`);gr.addColorStop(1,'rgba(200,200,205,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()}
      },()=>{svg.style.transform='';(function fade(){ctx.clearRect(0,0,W,H);let alive=0;parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.r+=.8;q.a-=.012;if(q.a>0){alive++;ctx.fillStyle=`rgba(220,220,225,${q.a})`;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()}});alive?requestAnimationFrame(fade):ctx.clearRect(0,0,W,H)})();done()});
    }};
  }},
];

  document.getElementById('toForm').onclick=()=>{step='form';render();scrollTo(0,0)};
  const go=()=>{if(spinning||prize)return;spinning=true;const b=document.getElementById('spin');b.disabled=true;b.lastChild.textContent='Крутится…';
    const i=pickSeg();ctrl.spin(i,()=>{spinning=false;prize=SEG[i].p;document.getElementById('prizeName').textContent=PIC[prize]+' '+prize;document.getElementById('prize').classList.add('show');document.getElementById('toForm').disabled=false;b.lastChild.textContent='Приз получен ✓';confetti()})};
  document.getElementById('spin').onclick=go;document.getElementById('stage').onclick=go;
}
function confetti(){
  const c=document.getElementById('confetti');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  c.hidden=false;c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d'),cols=['#c4312a','#1f9d55','#2b5ea8','#f5c542','#ffffff'];
  const ps=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,s:Math.random()*7+4,c:cols[Math.random()*5|0],r:Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<110)requestAnimationFrame(f);else c.hidden=true})();
}

function renderForm(){
  const cts=[['WhatsApp','wa','#25d366'],['Telegram','tg','#2aa3e0'],['MAX','max','#6d3fd8'],['Звонок','phone','#2b5ea8']];
  app.innerHTML=`<section class="screen"><form class="form-card" id="f" novalidate>
   <h2>Мы уже можем подобрать для вас варианты</h2><p class="sub">Оставьте контакт, чтобы получить подбор. Ответим в течение 15 минут.</p>
   ${prize?`<div class="bonus-tag"><span>${PIC[prize]}</span>Ваш приз: ${prize}, закрепим за вами</div>`:''}
   <div class="field" id="fn"><label for="name">Ваше имя</label><input id="name" autocomplete="given-name" placeholder="Иван"><span class="err-msg">Укажите имя</span></div>
   <div class="field" id="fp"><label for="phone">Телефон</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 (999) 999-99-99"><span class="err-msg">Нужен номер из 11 цифр</span></div>
   <div class="field" id="fc"><label>Как удобнее связаться (можно несколько)</label><div class="contacts">${cts.map(([n,k,c])=>`<button type="button" class="ct" data-v="${n}"><span class="cic" style="background:${c}">${I[k]}</span>${n}</button>`).join('')}</div><span class="err-msg">Выберите хотя бы один способ</span></div>
   <div class="field" id="fa"><label class="agree"><input class="form-check-input1" type="checkbox" id="agree1" name="agree1" checked required><span><a href="https://genixauto.ru/politika-konfidencialnosti.html" target="_blank" rel="noopener">Политика конфиденциальности</a></span></label><span class="err-msg">Поставьте галочку согласия с политикой конфиденциальности</span></div>
   <button class="btn" style="width:100%;margin-top:18px" type="submit"><span class="shine"></span>Получить подбор →</button>

  </form></section>`;
  const sel=new Set();
  app.querySelectorAll('.ct').forEach(b=>{rippleOn(b);b.onclick=()=>{b.classList.toggle('sel');sel.has(b.dataset.v)?sel.delete(b.dataset.v):sel.add(b.dataset.v)}});
  const ph=document.getElementById('phone');
  ph.addEventListener('input',()=>{let d=ph.value.replace(/\D/g,'');if(d.startsWith('8'))d='7'+d.slice(1);if(d&&!d.startsWith('7'))d='7'+d;d=d.slice(0,11);const p=[d.slice(1,4),d.slice(4,7),d.slice(7,9),d.slice(9,11)];ph.value=d?`+7${p[0]?' ('+p[0]:''}${p[1]?') '+p[1]:''}${p[2]?'-'+p[2]:''}${p[3]?'-'+p[3]:''}`:''});
  document.getElementById('f').onsubmit=e=>{e.preventDefault();
    const name=document.getElementById('name').value.trim(),dg=ph.value.replace(/\D/g,'');
    document.getElementById('fn').classList.toggle('err',!name);document.getElementById('fp').classList.toggle('err',dg.length!==11);document.getElementById('fc').classList.toggle('err',!sel.size);
    const ag=document.getElementById('agree1').checked;document.getElementById('fa').classList.toggle('err',!ag);
    if(!name||dg.length!==11||!sel.size||!ag)return;
    Object.assign(answers,{name,phone:ph.value,contacts:[...sel].join(', ')});step='thanks';render();scrollTo(0,0);
  };
}
function tgMessage(){return `Новая заявка:\n\nБюджет: ${BUDGETS[answers.budget]?.l||'—'}\nТип: ${bodyLabel()}\nСтрана: ${answers.country||'—'}\nПриоритет: ${answers.priority||'—'}\nСрок: ${answers.timing||'—'}\nРуль: ${answers.wheel||'—'}\nЭтап: ${answers.stage||'—'}\nКонтакт: ${answers.contacts||'—'}\nИмя: ${answers.name||'—'}\nТелефон: ${answers.phone||'—'}\nБонус: ${prize||'—'}`}
function renderThanks(){
  app.innerHTML=`<section class="screen"><div class="thanks"><img class="logow" src="${IMG.logo2}" alt="GENIXAUTO">
   <div class="big-check">${I.check}</div><h1>Спасибо! Заявка принята</h1>
   <p class="sub">Мы уже начали подбор и свяжемся с вами в ближайшее время${answers.contacts?': '+answers.contacts:''}.</p>
   ${prize?`<div class="bonus-tag"><span>${PIC[prize]}</span>Приз «${prize}» закреплён за вами</div>`:''}
   <div><a class="btn" href="https://genixauto.ru" target="_blank" rel="noopener"><span class="shine"></span>Вернуться на основной сайт →</a></div>
   <div class="socials"><a href="https://t.me/genixauto" target="_blank" rel="noopener" style="background:#2aa3e0" aria-label="Telegram">${I.tg}</a><a href="https://wa.me/79990585876" target="_blank" rel="noopener" style="background:#25d366" aria-label="WhatsApp">${I.wa}</a><a href="https://vk.com/genixauto" target="_blank" rel="noopener" style="background:#2787f5" aria-label="ВКонтакте">${I.vk}</a><a href="https://www.youtube.com/channel/UCC9hexAedmp34CEwEi9gW9w" target="_blank" rel="noopener" style="background:#e62117" aria-label="YouTube">${I.yt}</a></div>
   <details class="tg-preview"><summary>Так заявка придёт в Telegram-группу (видно только в макете)</summary><pre>${tgMessage()}</pre></details>
   <button class="btn ghost" id="again" style="margin-top:10px">Пройти заново</button></div></section>`;
  document.getElementById('again').onclick=()=>{answers={};prize=null;qi=0;step='hero';render()};
}

render();
</script>
